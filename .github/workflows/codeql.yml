# CodeQL static analysis of the Python here, with the security-extended query suite.
#
# This workflow IS the CodeQL setup: GitHub's "default setup" must stay off, because GitHub refuses
# results from an advanced workflow while default setup is enabled. Results go to the repository's
# code scanning alerts; the one write permission is the job's, to upload them.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC

permissions: read-all

jobs:
  analyze:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:python
