# The public test suite (tests/), on every supported Python and operating system.
#
# Stock Python only: nothing is installed, matching verify.py's promise that a recipient needs
# nothing but the interpreter. Every action is pinned by full commit SHA (its version in the
# comment); the token is read-only and is not kept in the checkout.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: The published kit verifies
        run: python verify.py examples/kit/reference_packet

      - name: The test suite (unittest, nothing installed)
        run: python -m unittest discover -s tests -v
